<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 100" width="416" height="100">
  <!-- gretl Logo SVG -->
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-size: 72px; font-weight: bold; fill: #1a1a1a; }
      .logo-symbol { fill: #1a1a1a; }
    </style>
  </defs>
  
  <!-- G Symbol (geometric representation of the gretl logo) -->
  <g class="logo-symbol">
    <!-- Main G shape -->
    <path d="M 30 20 L 50 20 Q 65 20 65 35 L 65 65 Q 65 80 50 80 L 30 80 Q 15 80 15 65 L 15 35 Q 15 20 30 20 Z" 
          fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner horizontal line for G -->
    <line x1="40" y1="50" x2="65" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Inner curve element -->
    <circle cx="50" cy="35" r="8" fill="#1a1a1a"/>
  </g>
  
  <!-- Text: gretl -->
  <text x="100" y="72" class="logo-text">gretl</text>
  
  <!-- Subtext: Association e.V. -->
  <text x="100" y="96" style="font-family: Arial, sans-serif; font-size: 16px; fill: #555555;">Association e.V.</text>
</svg>